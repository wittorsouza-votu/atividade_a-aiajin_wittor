<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario AÇAIAJIN</title>
    <link rel="stylesheet" href="_css/estilo.css">
</head>

<body>
    <h1>formulario SUPER<strong>AÇAI</strong>AJIN</h1>
    <FORM method="get" action="confirma.html">
        <fieldset>
            <legend>
                dados pessoais:
            </legend>
            <label>nome:<p></p><input type="text" required></label>
            <p></p>
            <label>idade:<p></p><input type="number" required></label>
            <p></p>
            <label>telefone:<p></p><input type="tel" required></label>
            <p></p>
            <label>endereço:<p></p><input type="text" required></label>
            <p></p>
            <label>planeta origem
                <br>
                <br>
                <select>
                    <option>planeta terra</option>
                    <option>planeta namek</option>
                    <option>planeta vegeta</option>
                    <option>outros<option>
                </select>
            </label>
        </fieldset>
        <fieldset>
            <legend>
                dados extras:
            </legend>
            <label>raça do univerço 7 preferida:
                <select>
                    <option>terraqueo</option>
                    <option>sayajin</option>
                    <option>namekuseijin</option>
                    <option>androide</option>
                    <option>outros</option>
                </select>
            </label>
            <br>
            <br>
            <label>trabalho:
                <input type="radio" name="cargo" value="1" checked>autonomo
                <input type="radio" name="cargo" value="2">empregado clt
                <input type="radio" name="cargo" value="3">empresario
                <input type="radio" name="cargo" value="4">tipo goku
            </label> 
        </fieldset>
        <fieldset>
            <legend>
                seu açai é perfeito de que jeito?
            </legend>
            <input type="checkbox">puro
            <input type="checkbox">com banana
            <input type="checkbox">com morango
            <input type="checkbox">com granola
            <input type="checkbox">tem gosto de terra
        </fieldset>
        <fieldset>
            <legend>
                qual o tamanho preferido?
            </legend>
            <input type="radio" name="tamanho" value="1" checked>500ml
            <input type="radio" name="tamanho" value="2">300ml
            <input type="radio" name="tamanho" value="3">100ml
            <input type="radio" name="tamanho" value="4">casquimha
            <input type="radio" name="tamanho" value="5">qual a parte do gosto de terra voce nao entendeu?
        </fieldset>
        <fieldset>
            observaçoes:<br>
            <textarea cols="195" rows="10">escreva suas observaçoes... eu gosto de açai porque...</textarea>
        </fieldset>
        <div>
            <input type="submit" value="ENVIAR">
            <input type="reset" value="LIMPAR">
        </div>
    </FORM>
</body>

</html>
